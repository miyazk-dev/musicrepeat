<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' addon:; img-src 'self' data: addon:; media-src blob: addon:; script-src 'self' addon:; connect-src 'self' addon: https://api.github.com https://github.com https://objects.githubusercontent.com" />
  <title>MusicRepeat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- タイトルバー -->
  <header id="titlebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="brand-icon"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/></svg>
      <span>MusicRepeat</span>
    </div>
    <div class="win-controls">
      <button id="btn-fs" class="win-btn" title="全画面 (F)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-max" class="win-btn" title="最大化">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button id="btn-min" class="win-btn" title="最小化">
        <svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-close" class="win-btn" title="閉じる">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <!-- サイドバー: プレイリスト -->
    <aside id="sidebar">
      <div class="side-head">
        <button id="btn-folder" class="btn btn-outline">
          <svg viewBox="0 0 24 24" class="ic"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          フォルダーを開く
        </button>
        <button id="btn-sort" class="ghost-btn" title="並び替え">名前順 ▾</button>
      </div>
      <div id="track-list" class="track-list">
        <div class="empty-hint">
          <p>フォルダーを選ぶと、</p>
          <p>中の音楽がずっと流れ続けます ☕</p>
          <p class="hint2">フォルダーを窓にドラッグしてもOK</p>
        </div>
      </div>
      <div id="side-foot" class="side-foot hidden">
        <span id="track-count"></span>
      </div>
    </aside>

    <!-- メイン -->
    <section id="main">
      <div class="now-card">
        <div class="now-label" id="now-label">NOW PLAYING</div>
        <h1 id="now-title">音楽を選んでください</h1>
        <div id="now-sub">フォルダー内の曲を、止めるまで自動で再生します</div>

        <canvas id="viz"></canvas>

        <div id="progress-wrap" class="progress-wrap" title="クリックで移動">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="time-row">
          <span id="time-cur">0:00</span>
          <span id="time-total">0:00</span>
        </div>

        <!-- 再生操作 -->
        <div class="transport">
          <button id="btn-prev" class="t-btn" title="前の曲 (Shift+←)">
            <svg viewBox="0 0 24 24"><path d="M6 5v14M20 5l-11 7 11 7V5z" fill="currentColor"/></svg>
          </button>
          <button id="btn-play" class="play-btn" title="再生 / 一時停止 (Space) ・長押しで速度・スリープ">
            <svg id="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
            <svg id="ic-pause" viewBox="0 0 24 24" class="hidden"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <button id="btn-stop" class="t-btn" title="停止 (長押しでスリープタイマー)">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          </button>
          <button id="btn-next" class="t-btn" title="次の曲 (Shift+→)">
            <svg viewBox="0 0 24 24"><path d="M18 5v14M4 5l11 7L4 19V5z" fill="currentColor"/></svg>
          </button>
        </div>

        <div class="transport-sub">
          <div class="chips">
            <button id="btn-shuffle" class="chip" title="シャッフル (S)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              シャッフル
            </button>
            <button id="btn-repeat" class="chip" title="リピート (R) ・長押しで選択">
              <svg viewBox="0 0 24 24" class="ic"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="repeat-label">全曲</span>
            </button>
            <button id="btn-speed" class="chip" title="再生速度 ・長押しでも選択できます">
              <svg viewBox="0 0 24 24" class="ic"><path d="M12 20a8 8 0 1 1 8-8M12 12l4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="speed-label">1.00x</span>
            </button>
            <button id="btn-sleep" class="chip" title="スリープタイマー">
              <svg viewBox="0 0 24 24" class="ic"><path d="M20 13A8 8 0 1 1 11 4a6 6 0 0 0 9 9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              <span id="sleep-label">スリープ</span>
            </button>
            <button id="btn-remote" class="chip" title="スマホから遠隔操作(同じWi-Fi)">
              <svg viewBox="0 0 24 24" class="ic"><rect x="7" y="2" width="10" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 18h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              📱 リモコン
            </button>
            <button id="btn-output" class="chip" title="出力デバイス / Bluetooth連携">
              <svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              🔊 出力先
            </button>
            <button id="btn-store" class="chip" title="店舗運用: 営業タイマー / リクエスト / サイネージ">
              🏪 店舗
            </button>
            <button id="btn-pomo" class="chip" title="ポモドーロタイマー連動">
              ⏳ ポモドーロ
            </button>
          </div>
          <div class="vol-wrap">
            <svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="vol" type="range" min="0" max="100" value="70" />
          </div>
        </div>
      </div>

      <!-- 音質調整カード -->
      <div class="eq-card" id="eq-card">
        <div class="tabs">
          <button id="tab-sound" class="tab on">サウンド</button>
          <button id="tab-adv" class="tab">上級者向け</button>
        </div>

        <!-- サウンドタブ -->
        <div id="panel-sound" class="panel">
          <div class="mode-row" id="mode-row">
            <button class="mode-pill" data-mode="off">オフ</button>
            <button class="mode-pill" data-mode="cafe">☕ カフェ</button>
            <button class="mode-pill" data-mode="relax">🌿 リラックス</button>
            <button class="mode-pill" data-mode="clear">✨ クリア</button>
          </div>
          <div class="sliders">
            <label class="slider-row" id="calm-row">
              <span class="s-label">落ち着かせる</span>
              <input id="calm" type="range" min="0" max="100" value="40" />
              <span class="s-val" id="calm-val">40</span>
            </label>
            <label class="slider-row toggle-row">
              <span class="s-label">自動音量(曲ごとの音量差をならす)</span>
              <span class="switch"><input id="agc" type="checkbox" checked /><i></i></span>
            </label>
          </div>
          <div id="mode-desc" class="mode-desc">フィルターなし・原音のまま再生します</div>
        </div>

        <!-- 上級者タブ -->
        <div id="panel-adv" class="panel hidden">
          <div class="adv-grid">
            <label class="slider-row">
              <span class="s-label">再生速度</span>
              <input id="speed" type="range" min="50" max="200" value="100" />
              <span class="s-val" id="speed-val">1.00x</span>
            </label>
            <label class="slider-row toggle-row">
              <span class="s-label">速度を変えても声の高さを保つ(ピッチ保持)</span>
              <span class="switch"><input id="pitchkeep" type="checkbox" checked /><i></i></span>
            </label>

            <div class="adv-sep"></div>

            <label class="slider-row">
              <span class="s-label">EQ 低音</span>
              <input id="eql" type="range" min="-12" max="12" value="0" />
              <span class="s-val" id="eql-val">0</span>
            </label>
            <label class="slider-row">
              <span class="s-label">EQ 中音</span>
              <input id="eqm" type="range" min="-12" max="12" value="0" />
              <span class="s-val" id="eqm-val">0</span>
            </label>
            <label class="slider-row">
              <span class="s-label">EQ 高音</span>
              <input id="eqh" type="range" min="-12" max="12" value="0" />
              <span class="s-val" id="eqh-val">0</span>
            </label>

            <div class="adv-sep"></div>

            <label class="slider-row">
              <span class="s-label">空間の広がり(リバーブ)</span>
              <input id="reverb" type="range" min="0" max="100" value="0" />
              <span class="s-val" id="reverb-val">0</span>
            </label>
            <label class="slider-row">
              <span class="s-label">ステレオ位置(パン)</span>
              <input id="pan" type="range" min="-100" max="100" value="0" />
              <span class="s-val" id="pan-val">中央</span>
            </label>
            <label class="slider-row toggle-row">
              <span class="s-label">モノラルで再生</span>
              <span class="switch"><input id="mono" type="checkbox" /><i></i></span>
            </label>
            <label class="slider-row toggle-row">
              <span class="s-label">曲の終わりでフェードアウト</span>
              <span class="switch"><input id="fade" type="checkbox" /><i></i></span>
            </label>
            <label class="slider-row">
              <span class="s-label">自動音量の目標レベル</span>
              <input id="agct" type="range" min="50" max="200" value="100" />
              <span class="s-val" id="agct-val">100%</span>
            </label>

            <div class="adv-sep"></div>

            <label class="slider-row">
              <span class="s-label">環境音を混ぜる</span>
              <select id="amb-sel">
                <option value="none">なし</option>
                <option value="rain">🌧 雨</option>
                <option value="fire">🔥 焚き火</option>
                <option value="murmur">☕ カフェのざわめき</option>
                <option value="file">📁 ファイルを指定</option>
              </select>
            </label>
            <label class="slider-row">
              <span class="s-label">環境音の量</span>
              <input id="amb" type="range" min="0" max="100" value="30" />
              <span class="s-val" id="amb-val">30</span>
            </label>
            <label class="slider-row hidden" id="amb-file-row">
              <span class="s-label">環境音ファイル</span>
              <button id="amb-file-btn" class="chip">選択</button>
              <span id="amb-file-name" class="hint2"></span>
            </label>

            <div class="adv-sep"></div>

            <label class="slider-row toggle-row">
              <span class="s-label">時間帯で自動切替(店舗向け)</span>
              <span class="switch"><input id="sched-sw" type="checkbox" /><i></i></span>
            </label>
            <div class="slider-row">
              <span class="s-label"></span>
              <button id="sched-edit" class="chip">⏰ スケジュール編集</button>
            </div>

            <div class="adv-sep"></div>
            <div class="adv-foot">
              <button id="btn-help" class="chip">⌨ ショートカット一覧</button>
              <button id="btn-notes" class="chip">📜 更新情報</button>
              <button id="btn-addons" class="chip">🧩 拡張機能</button>
              <span class="hint2">モードピルを長押しでも細かく調整できます</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- オーバーレイ類は JS が生成 -->
  <script src="renderer.js"></script>
</body>
</html>
