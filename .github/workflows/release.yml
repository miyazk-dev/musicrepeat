name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # ffmpeg.exe は 100MB 超のためリポジトリに含まれていない。
      # リリースビルド時に公式ビルドを取得して bin/ に配置する。
      - name: Download ffmpeg
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item "ffmpeg-tmp/ffmpeg-8.0-essentials_build/bin/ffmpeg.exe" -Destination "bin/ffmpeg.exe"

      - name: Build
        run: npm run dist
        env:
          # 署名なしでビルドする場合も electron-builder を通す
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/MusicRepeat-Setup-*.exe
            dist/MusicRepeat*.exe
            dist/latest.yml
